# Example Prometheus scrape config for HMS. Merge into your prometheus.yml.
# /actuator/prometheus is NOT public: it needs a Super Admin login or the scrape token.
# Set METRICS_SCRAPE_TOKEN (32+ random chars, e.g. `openssl rand -hex 32`) in the backend's env,
# put the same value in /etc/prometheus/hms_scrape_token (chmod 600), and Prometheus sends it as
# a bearer token. The token reads metrics only -- no patient or tenant data.
# See docs/monitoring/OBSERVABILITY.md §Securing the scrape.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - hms-alerts.yml

scrape_configs:
  - job_name: hms-backend
    metrics_path: /actuator/prometheus
    scheme: http
    static_configs:
      # Same-host scrape of the app port.
      - targets: ['127.0.0.1:8080']
        labels:
          environment: production
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/hms_scrape_token

