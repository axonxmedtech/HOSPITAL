# Production profile — tighter logging, no SQL output
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ── Database safety (Phase 9) ────────────────────────────────────────────────
# Production NEVER auto-modifies the schema. Hibernate only validates that the live schema matches
# the entities; all schema evolution is applied by versioned Flyway migrations. `baseline-on-migrate`
# adopts the existing populated database at V11 (the pre-Flyway high-water mark) WITHOUT recreating
# it or re-running V1-V11 (data is preserved). New migrations begin at V12.
# Escape hatch: HIBERNATE_DDL_AUTO=none disables validation if it is too strict against real drift
# (Flyway still owns schema). NEVER set this to `update`/`create` in production.
# See docs/database/DATABASE_MIGRATIONS.md.
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:validate}
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=11
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=false
spring.flyway.clean-disabled=true
logging.level.root=WARN
logging.level.com.hms=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=OFF
logging.level.com.zaxxer.hikari=WARN
