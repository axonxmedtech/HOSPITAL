# Staging profile — used when SPRING_PROFILES_ACTIVE=staging
# In-memory cache; avoids any Redis dependency issues on staging
spring.cache.type=simple

# ── Database safety (Phase 9) ────────────────────────────────────────────────
# No uncontrolled schema changes: Hibernate validates the schema instead of altering it.
# Schema evolution goes through Flyway migrations only. Override with HIBERNATE_DDL_AUTO=none
# if validation is too strict against an existing schema (see docs/database/DATABASE_MIGRATIONS.md).
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:validate}
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=11
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=false
spring.flyway.clean-disabled=true

# Keep the session open during request serialization as a safety net
# for any lazy-loaded associations not covered by JOIN FETCH queries
spring.jpa.open-in-view=true

# Verbose logging to diagnose issues
logging.level.com.hms=DEBUG
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
