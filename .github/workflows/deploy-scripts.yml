name: Deploy Scripts

# Release verification decides whether a deployment is accepted and when a rollback runs, so its
# behaviour is tested whenever it, or the workflow that calls it, changes.
on:
  push:
    paths:
      - 'scripts/deploy/**'
      - '.github/workflows/db-backup.yml'
      - '.github/workflows/_deploy.yml'
      - '.github/workflows/deploy-staging.yml'
      - '.github/workflows/deploy-prod.yml'
      - '.github/workflows/deploy-rollback.yml'
      - '.github/workflows/deploy-scripts.yml'
  pull_request:
    paths:
      - 'scripts/deploy/**'
      - '.github/workflows/db-backup.yml'
      - '.github/workflows/_deploy.yml'
      - '.github/workflows/deploy-staging.yml'
      - '.github/workflows/deploy-prod.yml'
      - '.github/workflows/deploy-rollback.yml'
      - '.github/workflows/deploy-scripts.yml'
  workflow_dispatch:

concurrency:
  group: deploy-scripts-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release-verification:
    name: Release verification scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Shellcheck deploy scripts
        run: shellcheck -S warning scripts/deploy/await-release.sh scripts/deploy/rollback.sh scripts/deploy/test-await-release.sh scripts/deploy/validate-config.sh scripts/deploy/test-validate-config.sh scripts/deploy/resolve-health-port.sh scripts/deploy/test-resolve-health-port.sh scripts/deploy/redact-log.sh scripts/deploy/test-redact-log.sh scripts/deploy/check-deploy-ref.sh scripts/deploy/test-check-deploy-ref.sh
      - name: Run await-release.sh scenario tests
        run: bash scripts/deploy/test-await-release.sh
      - name: Health-port validation and no-fallback guard
        run: bash scripts/deploy/test-validate-config.sh
      - name: Environment-scoped health-port resolution
        run: bash scripts/deploy/test-resolve-health-port.sh
      - name: Deployment log redaction
        run: bash scripts/deploy/test-redact-log.sh
      - name: Deploy branch guard and environment-scoped deploy key
        run: bash scripts/deploy/test-check-deploy-ref.sh
