# ────────────────────────────────────────────
# CI — Hospital Management System
# Orchestrator: delegates to reusable workflows
#
# build-frontend ──┐
# build-backend  ──┤──► sonar (quality gate)
# security       ──┘
# ────────────────────────────────────────────
#
# GitHub Variables  (Settings → Variables → Actions):
#   NODE_VERSION         Node.js version              (default: 22)
#   JAVA_VERSION         JDK version                  (default: 17)
#   STAGE_API_BASE_URL   Backend API URL baked into the staging frontend bundle
#   PROD_API_BASE_URL    Backend API URL baked into the production frontend bundle
#   SONAR_ORGANIZATION   SonarCloud organisation key  (e.g. axonxmedtech)
#   SONAR_PROJECT_KEY    SonarCloud project key       (e.g. axonxmedtech_HOSPITAL)
#
# GitHub Secrets  (Settings → Secrets → Actions):
#   SONAR_TOKEN   SonarCloud user token
#   NVD_API_KEY   (optional) NIST NVD key — speeds up OWASP scans
# ────────────────────────────────────────────

name: CI

on:
  push:
    branches:
      - main
      - staging
    tags:
      # Release tags build + package only. The deploy jobs key off a BRANCH ref
      # (refs/heads/staging|main), so a tag ref (refs/tags/v*) never deploys.
      - 'v*'
  pull_request:
    branches:
      - main
      - staging
  # Manual runs. NOTE: a manual run on `staging`/`main` still triggers the existing
  # deploy jobs (they key off the branch ref) — run manual CI from a feature branch
  # to build/test without deploying.
  workflow_dispatch:

# Cancel in-progress run for the same branch/PR when a new commit is pushed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Minimum permissions at the workflow level.
permissions:
  contents: read

jobs:

  # ── Validate — fast fail-fast gate (commits, lint, format) ───────────────
  # Runs first and cheaply; the heavy build/test/security jobs depend on it,
  # so a bad commit message or lint failure short-circuits before burning
  # compute. This also transitively gates deploy (deploy needs the build jobs).
  validate:
    uses: ./.github/workflows/_validate.yml
    with:
      node-version: ${{ vars.NODE_VERSION || '22' }}

  # ── Frontend build, type-check, coverage ────────────────────────────────
  build-frontend:
    needs: [validate]
    uses: ./.github/workflows/_build-frontend.yml
    with:
      node-version: ${{ vars.NODE_VERSION || '22' }}
      vite-api-base-url: ${{ github.ref == 'refs/heads/main' && vars.PROD_API_BASE_URL || vars.STAGE_API_BASE_URL }}

  # ── Backend compile, test (JaCoCo), package ──────────────────────────────
  build-backend:
    needs: [validate]
    uses: ./.github/workflows/_build-backend.yml
    permissions:
      contents: read
      checks: write
      pull-requests: write
    with:
      java-version: ${{ vars.JAVA_VERSION || '17' }}

  # ── Security: CodeQL, dependency-review, Gitleaks, npm audit, OWASP ─────
  security:
    needs: [validate]
    uses: ./.github/workflows/_security.yml
    permissions:
      contents: read
      security-events: write
      actions: read
      pull-requests: write
    with:
      node-version: ${{ vars.NODE_VERSION || '22' }}
      java-version: ${{ vars.JAVA_VERSION || '17' }}
    secrets: inherit

  # ── Java static analysis (Checkstyle · SpotBugs+FindSecBugs · PMD · Spotless) ─
  # Report-only: uploads reports + summarizes counts, never blocks. SonarCloud is the
  # enforced gate; this adds defense-in-depth and local/offline analysis parity.
  quality:
    needs: [validate]
    uses: ./.github/workflows/_quality.yml
    with:
      java-version: ${{ vars.JAVA_VERSION || '17' }}

  # ── Supply chain: SBOM, Trivy (fs + Dockerfile), license compliance ────────
  # Observe-mode / non-blocking: uploads SBOMs, SARIF (→ Security tab) and reports, and
  # summarizes. Deliberately NOT in deploy's `needs` and NOT in the required-fail list, so
  # it adds visibility without ever gating deployment. See docs/security/SUPPLY_CHAIN.md.
  supply-chain:
    needs: [validate]
    uses: ./.github/workflows/_supply-chain.yml
    permissions:
      contents: read
      security-events: write
      id-token: write
    with:
      node-version: ${{ vars.NODE_VERSION || '22' }}
      java-version: ${{ vars.JAVA_VERSION || '17' }}

  # ── SonarCloud quality gate ───────────────────────────────────────────────
  # Direct job (not reusable) — needs artifacts produced by build jobs.
  sonar:
    name: Quality — SonarCloud Analysis & Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build-frontend, build-backend]

    # Skip on fork PRs — secrets unavailable in untrusted fork contexts.
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)

    permissions:
      contents: read
      pull-requests: write

    steps:
      # Pin to SHA in production: https://github.com/actions/checkout/releases
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: ./.github/actions/setup-java
        with:
          java-version: ${{ vars.JAVA_VERSION || '17' }}

      - name: Compile backend (bytecode for Sonar)
        run: mvn test-compile -q -f backend/pom.xml

      # Pin to SHA in production: https://github.com/actions/download-artifact/releases
      - name: Download JaCoCo coverage report
        uses: actions/download-artifact@v4
        with:
          name: jacoco-xml-${{ github.sha }}
          path: backend/target/site/jacoco/

      # Pin to SHA in production: https://github.com/actions/download-artifact/releases
      - name: Download frontend LCOV coverage report
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage-${{ github.sha }}
          path: frontend/coverage/
        continue-on-error: true

      # Pin to SHA in production: https://github.com/SonarSource/sonarqube-scan-action/releases
      - name: Run SonarCloud analysis
        uses: sonarsource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN || vars.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.sources=backend/src/main/java,frontend/src
            -Dsonar.tests=backend/src/test/java
            -Dsonar.java.binaries=backend/target/classes
            -Dsonar.java.source=${{ vars.JAVA_VERSION || '17' }}
            -Dsonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml
            -Dsonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
            -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/target/surefire-reports/**,**/*.min.js,**/*.backup,**/frontend/src/pages/**
            -Dsonar.sourceEncoding=UTF-8
            -Dsonar.qualitygate.wait=${{ vars.SONAR_QUALITY_GATE_WAIT || 'true' }}
            -Dsonar.jasmin.internal.disabled=true

  # ── CI Summary — one consolidated status for developers ──────────────────
  # Aggregates every CI stage into the run summary and fails if any REQUIRED
  # stage failed, giving a single clear signal without digging through logs.
  # Purely informational for CD: the deploy jobs below do NOT depend on this,
  # so it never affects deployment.
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [validate, build-frontend, build-backend, security, quality, supply-chain, sonar]
    if: always()
    steps:
      - name: Aggregate stage results
        run: |
          {
            echo "## CI Summary"
            echo ""
            echo "| Stage | Result |"
            echo "| --- | --- |"
            echo "| Validate (commits/lint/format) | ${{ needs.validate.result }} |"
            echo "| Frontend build + tests | ${{ needs.build-frontend.result }} |"
            echo "| Backend build + tests (+coverage floor) | ${{ needs.build-backend.result }} |"
            echo "| Security scans | ${{ needs.security.result }} |"
            echo "| Java static analysis (report-only) | ${{ needs.quality.result }} |"
            echo "| Supply chain (SBOM/Trivy/licenses, observe) | ${{ needs.supply-chain.result }} |"
            echo "| SonarCloud quality gate | ${{ needs.sonar.result }} |"
            echo ""
            echo "Commit \`${{ github.sha }}\` on \`${{ github.ref_name }}\` — [run #${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if any required stage failed
        if: >
          needs.validate.result == 'failure' ||
          needs.build-frontend.result == 'failure' ||
          needs.build-backend.result == 'failure' ||
          needs.security.result == 'failure'
        run: |
          echo "::error::One or more required CI stages failed — see the CI Summary above."
          exit 1

  # ── Deploy — Staging ───────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy — Staging
    needs: [build-frontend, build-backend, security, sonar]
    if: >
      github.ref == 'refs/heads/staging' &&
      always() &&
      needs.build-frontend.result == 'success' &&
      needs.build-backend.result == 'success' &&
      needs.security.result == 'success' &&
      (needs.sonar.result == 'success' || needs.sonar.result == 'skipped')
    uses: ./.github/workflows/_deploy.yml
    permissions:
      contents: read
      pull-requests: write
    with:
      environment: Staging
      repo_path: /var/www/hms/staging/repo_stage
      service_name: hms-staging
      git_branch: staging
      ssh_host: ${{ vars.STAGING_SSH_HOST }}
      ssh_port: ${{ vars.STAGING_SSH_PORT || '22' }}
      health_port: ${{ vars.STAGING_HEALTH_PORT || '8080' }}
      app_url: ${{ vars.STAGING_APP_URL }}
      enable_rollback: false
      notify_slack: false
    secrets:
      ssh_key: ${{ secrets.SSH_PRIVATE_KEY }}
      ssh_user: ${{ secrets.SSH_USERNAME }}

  # ── Deploy — Production ────────────────────────────────────────────────────
  deploy-production:
    name: Deploy — Production
    needs: [build-frontend, build-backend, security, sonar]
    if: >
      github.ref == 'refs/heads/main' &&
      always() &&
      needs.build-frontend.result == 'success' &&
      needs.build-backend.result == 'success' &&
      needs.security.result == 'success' &&
      (needs.sonar.result == 'success' || needs.sonar.result == 'skipped')
    uses: ./.github/workflows/_deploy.yml
    permissions:
      contents: read
      pull-requests: write
    with:
      environment: Production
      repo_path: /var/www/hms/production/repo_prod
      service_name: hms-production
      git_branch: main
      ssh_host: ${{ vars.PRODUCTION_SSH_HOST }}
      ssh_port: ${{ vars.PRODUCTION_SSH_PORT || '22' }}
      health_port: ${{ vars.PRODUCTION_HEALTH_PORT || '8080' }}
      app_url: ${{ vars.PRODUCTION_APP_URL }}
      enable_rollback: true
      notify_slack: true
    secrets:
      ssh_key: ${{ secrets.SSH_PRIVATE_KEY }}
      ssh_user: ${{ secrets.SSH_USERNAME }}
      slack_webhook: ${{ secrets.PRODUCTION_SLACK_WEBHOOK }}
