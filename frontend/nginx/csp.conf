# AxonX HMS — the Content-Security-Policy, in one place for the VPS and the Docker image.
#
# Installed at /etc/nginx/hms/csp.conf. Include it in the server block AFTER setting
# $hms_api_origin and $hms_ws_origin. It only defines $hms_csp; the server block decides
# whether that is sent enforced or report-only (see site-example.conf).
#
# Why each non-'self' source is here:
#   style-src  'unsafe-inline'      React <style> blocks and print documents' inline CSS
#   style-src/font-src Google Fonts  Inter is loaded from fonts.googleapis.com / fonts.gstatic.com
#   img-src    https: data: blob:   hospital logos (Cloudinary/any https), emoji favicons, previews
#   connect-src API + WebSocket     $hms_api_origin / $hms_ws_origin (VITE_API_BASE_URL)
#   connect-src api.cloudinary.com  hospital logo upload (ProfileModal)
#   frame-src  blob:                PDF preview and in-page printing of PDFs
#   script-src hashes:
#     sha256-SCWt…  the print trigger printHtml.js injects into the iOS print window
#                   (frontend/src/utils/printHtml.js — a test fails if it changes)
#     sha256-pwQd…  onerror="this.style.display='none'" hiding a broken logo on printouts
#                   ('unsafe-hashes' lets exactly this handler run, nothing else)
set $hms_csp "default-src 'self'; script-src 'self' 'unsafe-hashes' 'sha256-SCWtRMNQDc1hqUxChUK4cWLYhzuE/glgPPtvRBV6ziE=' 'sha256-pwQduWxX3Cm7lLbQmAos7n73RLP4QrsCDFejmsBdZ78='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' $hms_api_origin $hms_ws_origin https://api.cloudinary.com; frame-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'";
