# AxonX HMS — example server block for the VPS nginx (frontend app host).
#
# This is a TEMPLATE for the existing site file (e.g. /etc/nginx/sites-available/<app-site>).
# Keep your existing `listen 443 ssl`, `ssl_certificate*` (Let's Encrypt / certbot) and port-80
# redirect lines; replace the frontend `location` blocks with the three `set` lines and the
# `include` below. Full rollout steps: docs/deployment/NGINX_HARDENING.md.

server {
    listen 443 ssl;
    server_name staging-app.axonxmedtech.com;          # production: app.axonxmedtech.com

    # ssl_certificate     /etc/letsencrypt/live/<domain>/fullchain.pem;   # keep existing lines
    # ssl_certificate_key /etc/letsencrypt/live/<domain>/privkey.pem;

    root /var/www/hms/staging/repo_stage/frontend/dist;  # production: /var/www/hms/production/repo_prod/frontend/dist
    index index.html;

    # ── Per-environment values ───────────────────────────────────────────────────────────────
    # API origin the browser calls (VITE_API_BASE_URL) — needed for CSP connect-src.
    set $hms_api_origin "https://staging-api.axonxmedtech.com";   # production: https://api.axonxmedtech.com
    set $hms_ws_origin  "wss://staging-api.axonxmedtech.com";     # production: wss://api.axonxmedtech.com

    # HSTS: start at 5 minutes; raise to 31536000 (1 year) after a clean week. Browsers remember
    # HSTS for max-age, so a short value first keeps a mistake reversible.
    set $hms_hsts "max-age=300";

    # Content-Security-Policy. Ships REPORT-ONLY: violations appear in the browser console but
    # nothing is blocked. After a clean week on staging, enforce it by moving the policy from
    # $hms_csp_report to $hms_csp_enforce (and leaving $hms_csp_report empty).
    include hms/csp.conf;   # defines $hms_csp
    set $hms_csp_enforce "";
    set $hms_csp_report  $hms_csp;

    include hms/spa.conf;
}

# Port 80 → HTTPS (already in place; certbot usually manages this block).
server {
    listen 80;
    server_name staging-app.axonxmedtech.com;
    return 301 https://$host$request_uri;
}
