# AxonX HMS — security headers for every response that serves the frontend.
#
# Installed at /etc/nginx/hms/security-headers.conf (server and Docker image alike).
#
# WHY THIS IS INCLUDED PER LOCATION: nginx drops every server-level `add_header` inside a
# location that sets its own `add_header` (e.g. Cache-Control). spa.conf therefore includes this
# file inside each location instead of once at server level.
#
# The values come from variables the server block sets (see site-example.conf):
#   $hms_hsts         Strict-Transport-Security value (empty = header not sent)
#   $hms_csp_enforce  Content-Security-Policy value            (empty = not sent)
#   $hms_csp_report   Content-Security-Policy-Report-Only value (empty = not sent)
# nginx skips an add_header whose value is empty, which is how CSP is switched from
# report-only to enforced without editing this file.

add_header Strict-Transport-Security $hms_hsts always;
add_header Content-Security-Policy $hms_csp_enforce always;
add_header Content-Security-Policy-Report-Only $hms_csp_report always;

add_header X-Content-Type-Options "nosniff" always;
# SAMEORIGIN, not DENY: bills and clinical forms print through a same-origin hidden iframe.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
# Private clinical application: never index any environment.
add_header X-Robots-Tag "noindex, nofollow" always;
