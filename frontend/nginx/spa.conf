# AxonX HMS — how the built frontend (Vite `dist/`) is served. Include inside a `server` block
# whose `root` is the dist directory and which sets the $hms_* variables (see site-example.conf).
#
# Installed at /etc/nginx/hms/spa.conf.

server_tokens off;

# ── Compression ─────────────────────────────────────────────────────────────────────────────
# The main bundle is ~300 KB raw and was served uncompressed (~90 KB gzipped).
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css text/javascript application/javascript application/json
           application/xml image/svg+xml;

# ── Hashed build assets: cache for a year ───────────────────────────────────────────────────
# Vite puts a content hash in every file name under /assets/, so a changed file always has a
# new URL. A missing asset must be a real 404 — never index.html — so a stale tab after a
# deploy gets a clean error (the app's ErrorBoundary then reloads once).
location /assets/ {
    try_files $uri =404;
    include hms/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

# ── Entry point and metadata: always revalidate ─────────────────────────────────────────────
# index.html must never be cached stale, or users keep loading the previous release's bundle.
location = /index.html {
    include hms/security-headers.conf;
    add_header Cache-Control "no-cache" always;
}

location = /version.json {
    include hms/security-headers.conf;
    add_header Cache-Control "no-store" always;
}

# ── Never serve dot-files (.env, .git, …) ───────────────────────────────────────────────────
location ~ /\.(?!well-known/) {
    include hms/security-headers.conf;
    return 404;
}

# ── Everything else: real files, otherwise the SPA ──────────────────────────────────────────
location / {
    try_files $uri $uri/ /index.html;
    include hms/security-headers.conf;
    add_header Cache-Control "no-cache" always;
}
