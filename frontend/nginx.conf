# Docker image config (frontend/Dockerfile). The VPS uses the same snippets via
# frontend/nginx/site-example.conf — see docs/deployment/NGINX_HARDENING.md.
server {
    listen 8080;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # TLS is terminated in front of this container, so it sends no HSTS.
    set $hms_hsts "";

    # API origin baked into the bundle at build time (VITE_API_BASE_URL); localhost by default.
    set $hms_api_origin "http://localhost:8080";
    set $hms_ws_origin  "ws://localhost:8080";

    # Report-only here too; see site-example.conf for switching to enforced.
    include hms/csp.conf;   # defines $hms_csp
    set $hms_csp_enforce "";
    set $hms_csp_report  $hms_csp;

    include hms/spa.conf;
}
